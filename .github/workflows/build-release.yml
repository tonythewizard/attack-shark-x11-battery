name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build and test
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/installer/AttackSharkX11-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttackSharkX11-Windows-Installer
          path: |
            dist/installer/AttackSharkX11-Setup-*.exe
            dist/installer/AttackSharkX11-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem "dist/installer/AttackSharkX11-Setup-*.exe" | Select-Object -First 1
          $checksum = "$($installer.FullName).sha256"

          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $installer.FullName $checksum --clobber
          }
          else {
            gh release create $tag $installer.FullName $checksum `
              --title "Attack Shark X11 $tag" `
              --generate-notes
          }
