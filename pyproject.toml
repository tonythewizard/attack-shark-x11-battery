[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-shark-x11-battery"
version = "1.1.0"
description = "Native Qt tray battery monitor and dashboard for the Attack Shark X11 mouse"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Antonio" }]
keywords = ["attack-shark", "mouse", "battery", "hid", "tray"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "hidapi>=0.14,<1",
  "Pillow>=10,<13",
  "PySide6>=6.7,<7",
]

[project.urls]
Homepage = "https://github.com/tonythewizard/attack-shark-x11-battery"
Repository = "https://github.com/tonythewizard/attack-shark-x11-battery"
Issues = "https://github.com/tonythewizard/attack-shark-x11-battery/issues"

[project.gui-scripts]
attack-shark-x11 = "attack_shark_x11.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
